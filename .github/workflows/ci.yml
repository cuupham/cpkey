name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # .clang-format needs clang-format 21 or newer; the pin keeps results stable across runs.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python -m pip install clang-format==23.1.3

      # path-type inherit keeps the pip-installed clang-format visible to make.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Check format, build, test
        shell: msys2 {0}
        run: make format-check all test
